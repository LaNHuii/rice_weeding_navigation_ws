- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /rice_weeding/simulation/pose_info
  gz_topic_name: /world/paddy_field/dynamic_pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /rice_weeding/simulation/wheel_joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /rice_weeding/safety/cmd_vel
  gz_topic_name: /rice_weeding/simulation/internal/locked_cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# Gazebo DiffDrive odometry remains unbridged: simulation_chassis_odometry is
# the unique ROS owner of odom -> base_footprint.
